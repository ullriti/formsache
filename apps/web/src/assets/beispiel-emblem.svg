<!--
  Zweites Beispiel-Logo, quadratisch statt breit: die beiden mitgelieferten
  Assets decken die zwei Seitenverhältnisse ab, an denen sich Kopfzeile und
  Mail-Vorlage unterschiedlich verhalten. Ebenfalls neutral — es steht für
  keine reale Organisation.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Beispiel-Emblem">
  <circle cx="32" cy="32" r="29" fill="#f3f1ea" stroke="#3f4c6b" stroke-width="3" />
  <path d="M32 12l17 10v20L32 52 15 42V22z" fill="none" stroke="#8c6b3f" stroke-width="3" stroke-linejoin="round" />
  <circle cx="32" cy="32" r="7" fill="#3f4c6b" />
</svg>
