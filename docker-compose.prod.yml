# The production stack. Standalone — this file starts everything:
#
#   ./scripts/prod-setup.sh                        # create .env
#   docker compose -f docker-compose.prod.yml up -d
#
# Nothing is built here, it is pulled: the images come from the registry
# (`IMAGE_PREFIX`, `APP_VERSION` in the `.env`).
#
# **No service publishes a port**, `web` included. TLS and reachability from
# outside are the operator's business — their own reverse proxy goes in front
# of `web`, see the commented-out block there.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-formsache}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD fehlt - siehe .env.prod.example}
      POSTGRES_DB: ${POSTGRES_DB:-formsache}
      # Deterministic sorting, independent of the machine's locale.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # One-off run: applies the migrations and ends. The same version as `api`
  # — a migration image from a different run drives schema and reader apart.
  # No seed variables: the first access is created via
  # `scripts/create-superadmin.sh`, not via the seed.
  migrate:
    image: ${IMAGE_PREFIX:-ghcr.io/ullriti}/formsache-migrate:${APP_VERSION:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-formsache}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-formsache}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy

  api:
    image: ${IMAGE_PREFIX:-ghcr.io/ullriti}/formsache-api:${APP_VERSION:-latest}
    restart: unless-stopped
    # A PID 1 that reaps children and passes SIGTERM on.
    init: true
    environment:
      # Fixed, not from the environment: this is the operating mode, and a stack
      # that pulled it from a `.env` could lose it without anything being
      # noticed. It is no longer what decides `Secure` on the session cookie —
      # that is the explicit variable below, which merely *defaults* to this.
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-formsache}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-formsache}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # `Secure` and the `__Host-` name on the session cookie. **Leave it at
      # `true`** — this file's documented shape has TLS in front of `web`, and
      # over TLS the cookie is both integrity-protected and unforgeable by a
      # neighbouring host.
      #
      # Set `false` in exactly one case: an installation reached over plain
      # http inside one's own network. A browser accepts a `Secure` cookie over
      # `http://localhost` but silently discards it over `http://192.168.1.10`,
      # so with `true` such a deployment logs in with a 200 and stays anonymous.
      # The price is named in `.env.prod.example` and in `docs/kb/09-betrieb.md`:
      # without the prefix, a neighbouring host under the same parent domain can
      # write the session cookie. Never on a publicly reachable installation.
      # Changing the value renames the cookie and logs everybody out.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SECRET_BOX_KEY: ${SECRET_BOX_KEY:?SECRET_BOX_KEY fehlt - siehe .env.prod.example}
      # One hop: the `web` service in front replaces `X-Forwarded-For`
      # instead of appending. Even with a further proxy in front it stays 1 —
      # the front door resolves the caller itself via `TRUSTED_PROXY_CIDR`.
      TRUST_PROXY_HOPS: 1
      MAIL_WORKER_INTERVAL_MS: ${MAIL_WORKER_INTERVAL_MS:-15000}
      MAIL_PURGE_INTERVAL_MS: ${MAIL_PURGE_INTERVAL_MS:-86400000}
      FILE_PURGE_INTERVAL_MS: ${FILE_PURGE_INTERVAL_MS:-86400000}
      TRASH_PURGE_INTERVAL_MS: ${TRASH_PURGE_INTERVAL_MS:-86400000}
      SESSION_PURGE_INTERVAL_MS: ${SESSION_PURGE_INTERVAL_MS:-86400000}
      AI_USAGE_PURGE_INTERVAL_MS: ${AI_USAGE_PURGE_INTERVAL_MS:-86400000}
      AI_REQUEST_TIMEOUT_MS: ${AI_REQUEST_TIMEOUT_MS:-60000}
      OPS_ALERT_INTERVAL_MS: ${OPS_ALERT_INTERVAL_MS:-300000}
      OIDC_ISSUER_ALLOWLIST: ${OIDC_ISSUER_ALLOWLIST:-}
      # A path **inside the container**, therefore fixed here and not from `.env`.
      FILE_STORAGE_DIR: /var/lib/formsache/files
    volumes:
      # The uploads do not live in the database; a backup needs both.
      - api-files:/var/lib/formsache/files
    expose:
      - '3000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: ${IMAGE_PREFIX:-ghcr.io/ullriti}/formsache-web:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:3000
      # Whom the front door believes an `X-Forwarded-For` from. The default is
      # the private range out of which Docker hands out its networks — that is,
      # one's own reverse proxy. A wider value here would mean: every made-up
      # header gets its own rate-limit bucket.
      TRUSTED_PROXY_CIDR: ${TRUSTED_PROXY_CIDR:-172.16.0.0/12}
    # Your own reverse proxy reaches this service on port 8080 — in one of the
    # two ways below. Uncomment one of them:
    #
    # 1. Proxy on the host: publish the port, bound to loopback.
    # ports:
    #   - '127.0.0.1:8080:8080'
    #
    # 2. Proxy in a container: join its network and address `web:8080`.
    # networks: [default, proxy]
    depends_on:
      api:
        condition: service_healthy

# networks:
#   proxy:
#     external: true

volumes:
  db-data:
  api-files:
