packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks install scripts by default (supply-chain guard, ADR-0006).
# Only these packages need one — both ship native binaries.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# Shared dependency versions live here, not in the individual workspaces
# (ADR-0006). A workspace references them with "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 26.6.1
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  eslint: 10.10.0
  prettier: 3.9.8
  react: 19.3.0
  react-dom: 19.3.0
  typescript: 5.9.3
  typescript-eslint: 8.70.0
  vitest: 4.1.11
  zod: 4.6.5
