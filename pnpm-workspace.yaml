packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks install scripts by default (supply-chain guard, ADR-0006).
# Only these packages need one — both ship native binaries.
onlyBuiltDependencies:
  - '@swc/core'
  - esbuild

# Shared dependency versions live here, not in the individual workspaces
# (ADR-0006). A workspace references them with "catalog:".
catalog:
  '@eslint/js': 10.0.1
  '@types/node': 26.2.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  eslint: 10.8.1
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 5.9.3
  typescript-eslint: 8.67.0
  vitest: 4.1.10
  zod: 4.4.3
